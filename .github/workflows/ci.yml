name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon
      - name: Publicar reporte de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-backend
          path: backend/build/reports/tests/test

  database:
    name: Esquema MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          # Contenedor efímero de CI sin datos reales: no se versiona ninguna contraseña
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=5s
          --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necesario para leer el esquema v1 desde el historial
      - name: Base nueva - schema.sql, datos de desarrollo y prueba de restricciones
        run: |
          mysql -h 127.0.0.1 -uroot < database/schema.sql
          mysql -h 127.0.0.1 -uroot < database/datos-desarrollo.sql
          mysql -h 127.0.0.1 -uroot < database/pruebas/verificar-restricciones.sql
      - name: Base existente - migraciones 002 y 003 sobre el esquema v1
        run: |
          mysql -h 127.0.0.1 -uroot -e "DROP DATABASE racemanager"
          git show 5792797:database/schema.sql | mysql -h 127.0.0.1 -uroot
          mysql -h 127.0.0.1 -uroot < database/migraciones/002_importacion_y_publicacion.sql
          mysql -h 127.0.0.1 -uroot < database/migraciones/003_detalle_importacion.sql
          mysql -h 127.0.0.1 -uroot < database/pruebas/verificar-restricciones.sql

  frontend:
    name: Frontend (pruebas + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
