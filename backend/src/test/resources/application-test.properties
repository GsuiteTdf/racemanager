# Perfil "test": base H2 en memoria (modo MySQL) para ejecutar las pruebas sin MySQL.
# Las pruebas contra MySQL real se agregan cuando las entidades se validen con schema.sql.
spring.datasource.url=jdbc:h2:mem:racemanager;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Secreto aleatorio generado en cada ejecución: no hay ninguna clave fija versionada
racemanager.jwt.secret=${random.value}${random.value}
racemanager.jwt.expiracion-minutos=15
